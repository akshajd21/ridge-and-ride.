<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b0e23">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ridge-and-ride-cars.html</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e23;--pk:#ff2e88;--cy:#2ee6d6;--or:#ff7a3c;--tx:#f5f5f7;--pn:rgba(11,14,35,.78);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit;margin:0;padding:0}
html,body{touch-action:manipulation;height:100%;background:var(--bg);color:var(--tx);font-family:'Space Mono',monospace,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;display:block}
.scr{position:fixed;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:14px;text-align:center;padding:16px;overflow-y:auto;background:linear-gradient(rgba(11,14,35,.7),transparent 38%,transparent 58%,rgba(11,14,35,.85))}
.scr.on{display:flex}
h1,h2,.big{font-family:Orbitron,sans-serif;font-weight:900;letter-spacing:3px}
h1{font-size:34px;font-size:clamp(24px,5.5vw,52px);color:#fff;text-shadow:0 0 14px var(--pk),0 0 40px var(--pk),3px 3px 0 var(--pk);max-width:900px;font-style:italic}
h2{font-size:26px;color:var(--cy);text-shadow:0 0 16px var(--cy)}
.brand{font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:4px;color:var(--or)}
.sub{opacity:.85;font-size:13px}
.b{font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;letter-spacing:2px;padding:12px 26px;min-width:23px}
